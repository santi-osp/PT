<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="ptBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#031126" />
      <stop offset="50%" stop-color="#0A2540" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="ptAccentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4B2" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <pattern id="ptGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
    <filter id="ptGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#ptBgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#ptGrid)" />

  <!-- Ambient Glow -->
  <circle cx="1020" cy="110" r="160" fill="#00D4B2" opacity="0.14" filter="url(#ptGlow)" />
  <circle cx="200" cy="270" r="140" fill="#635BFF" opacity="0.12" filter="url(#ptGlow)" />

  <!-- Status Badge -->
  <g transform="translate(80, 52)">
    <rect width="270" height="32" rx="16" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(0, 212, 178, 0.3)" stroke-width="1" />
    <circle cx="16" cy="16" r="4.5" fill="#00D4B2" />
    <text x="30" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#A7F3D0" letter-spacing="1.2">CLEAN ARCHITECTURE MONOREPO</text>
  </g>

  <!-- Title & Narrative -->
  <g transform="translate(80, 142)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
      DataGo <tspan fill="url(#ptAccentGrad)">Enterprise</tspan>
    </text>
    <text y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="400" fill="#E2E8F0" letter-spacing="0.2">
      Residential Customer Management &amp; Service Lifecycle Control System
    </text>
    <text y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#38BDF8">
      ASP.NET Core 10 · C# 14 · PostgreSQL (Neon) Stored Routines · Angular 21 Standalone
    </text>
  </g>

  <!-- Key Metrics Row -->
  <g transform="translate(80, 260)">
    <rect x="0" y="0" width="180" height="46" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" />
    <text x="16" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10.5" font-weight="600" fill="#38BDF8" text-transform="uppercase">BACKEND</text>
    <text x="16" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13.5" font-weight="700" fill="#FFFFFF">.NET 10 / C# 14</text>

    <rect x="200" y="0" width="180" height="46" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" />
    <text x="16" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10.5" font-weight="600" fill="#38BDF8" text-transform="uppercase">DATABASE</text>
    <text x="16" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13.5" font-weight="700" fill="#00D4B2">Postgres Stored Procs</text>

    <rect x="400" y="0" width="180" height="46" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" />
    <text x="16" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10.5" font-weight="600" fill="#38BDF8" text-transform="uppercase">FRONTEND</text>
    <text x="16" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13.5" font-weight="700" fill="#F43F5E">Angular 21 Reactive</text>
  </g>

  <!-- Right Visual: Clean Layers Graphic -->
  <g transform="translate(910, 75)">
    <rect x="0" y="0" width="220" height="190" rx="14" fill="rgba(10, 37, 64, 0.85)" stroke="rgba(0, 212, 178, 0.3)" stroke-width="1.5" />
    
    <!-- Concentric Architecture Rings -->
    <circle cx="110" cy="85" r="55" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" />
    <circle cx="110" cy="85" r="38" fill="none" stroke="rgba(0, 212, 178, 0.5)" stroke-width="1.5" />
    <circle cx="110" cy="85" r="20" fill="rgba(0, 212, 178, 0.2)" stroke="#00D4B2" stroke-width="2" />
    <text x="110" y="89" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="9" font-weight="800" fill="#FFFFFF" text-anchor="middle">CORE</text>

    <!-- Subtext bar -->
    <rect x="25" y="150" width="170" height="24" rx="6" fill="rgba(255, 255, 255, 0.06)" />
    <text x="110" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="10.5" font-weight="700" fill="#38BDF8" text-anchor="middle">Domain Driven Design</text>
  </g>
</svg>